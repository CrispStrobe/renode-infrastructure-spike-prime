name: SPIKE source references
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: python3 tools/check_pybricks_references.py
